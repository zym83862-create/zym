
            $uploadMbps = [math]::Round(
              ([double]$result.upload.bandwidth * 8) / 1000000,
              2
            )

            $downloadGbps = [math]::Round(
              $downloadMbps / 1000,
              3
            )

            $uploadGbps = [math]::Round(
              $uploadMbps / 1000,
              3
            )

            $ping = [math]::Round(
              [double]$result.ping.latency,
              2
            )

            $results += [pscustomobject]@{
              Run = $i
              DownloadMbps = $downloadMbps
              DownloadGbps = $downloadGbps
              UploadMbps = $uploadMbps
              UploadGbps = $uploadGbps
              PingMs = $ping
              ISP = $result.isp
              Server = $result.server.name
              Location = $result.server.location
            }

            Write-Host "Run $i:"
            Write-Host "  Server:   $($result.server.name)"
            Write-Host "  Location: $($result.server.location)"
            Write-Host "  Ping:     $ping ms"
            Write-Host "  Download: $downloadMbps Mbps ($downloadGbps Gbps)"
            Write-Host "  Upload:   $uploadMbps Mbps ($uploadGbps Gbps)"

            if ($i -lt 3) {
              Start-Sleep -Seconds 3
            }
          }

          $bestDownload = $results | Sort-Object DownloadMbps -Descending | Select-Object -First 1
          $bestUpload = $results | Sort-Object UploadMbps -Descending | Select-Object -First 1

          $averageDownload = [math]::Round(
            (($results | Measure-Object -Property DownloadMbps -Average).Average),
            2
          )

          $averageUpload = [math]::Round(
            (($results | Measure-Object -Property UploadMbps -Average).Average),
            2
          )

          Write-Host ""
          Write-Host "========================================"
          Write-Host "      ACTUAL RUNNER INTERNET SPEED"
          Write-Host "========================================"
          Write-Host "Best Download:   $($bestDownload.DownloadMbps) Mbps"
          Write-Host "Best Download:   $($bestDownload.DownloadGbps) Gbps"
          Write-Host "Best Upload:     $($bestUpload.UploadMbps) Mbps"
          Write-Host "Best Upload:     $($bestUpload.UploadGbps) Gbps"
          Write-Host "Average Download:$averageDownload Mbps"
          Write-Host "Average Upload:  $averageUpload Mbps"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "No value is fabricated or forced to 1 Gbps."
          Write-Host "These are actual measurements from the GitHub runner."
      - name: Show Access
        shell: pwsh
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: GitHub Secret RDP_PASSWORD"
          Write-Host "Command:  mstsc /v:$env:TAILSCALE_IP"

      - name: Maintain Connection
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP active..."
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" |
            Remove-NetFirewallRule

          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" |
            Remove-NetFirewallRule

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $ts) {
            & $ts logout
          }
