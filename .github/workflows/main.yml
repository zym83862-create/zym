name: "RDP + Speed Test"

"on":
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "PortNumber" -Value 3389 -Force

          Set-Service -Name "TermService" -StartupType Automatic
          Restart-Service -Name "TermService" -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RDP"
          $passwordText = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($passwordText)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $securePassword = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($null -ne $existing) {
            Set-LocalUser -Name $username -Password $securePassword
          }
          else {
            New-LocalUser -Name $username -Password $securePassword -AccountNeverExpires -PasswordNeverExpires
          }

          Enable-LocalUser -Name $username

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          "RDP_USER=$username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
            throw "RDP user creation failed."
          }

          Write-Host "RDP user is ready."
          Write-Host "Password was not printed."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = Join-Path $env:TEMP "tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $p = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/i", $installer, "/quiet", "/norestart") -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($p.ExitCode -ne 0) {
            throw "Tailscale installation failed with exit code $($p.ExitCode)."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable not found."
          }

          & $ts version

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
