name: "RDP + Speed Test"

"on": workflow_dispatch

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'PortNumber' -Value 3389 -Force
          Set-Service -Name 'TermService' -StartupType Automatic
          Restart-Service -Name 'TermService' -Force
          Start-Sleep -Seconds 5

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'RDP_PASSWORD secret is missing.'
          }

          $username = 'RDP'
          $password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser -Name $username -Password $password
          }
          else {
            New-LocalUser -Name $username -Password $password -AccountNeverExpires -PasswordNeverExpires
          }

          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Administrators' -Member $username -ErrorAction SilentlyContinue

          "RDP_USER=$username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host 'RDP user configured. Password was not printed.'

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installer = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $url -OutFile $installer

          $p = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/i', $installer, '/quiet', '/norestart') -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($p.ExitCode -ne 0) {
            throw "Tailscale installation failed: $($p.ExitCode)"
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw 'Tailscale executable not found.'
          }

          & $ts version

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw 'Tailscale executable not found.'
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
            throw 'TAILSCALE_AUTH_KEY secret is missing.'
          }

          $service = Get-Service -Name 'Tailscale' -ErrorAction SilentlyContinue

          if (-not $service) {
            throw 'Tailscale service not found.'
          }

          if ($service.Status -ne 'Running') {
            Start-Service -Name 'Tailscale'
            Start-Sleep -Seconds 5
          }

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          & $ts up "--auth-key=$env:TS_AUTH_KEY" "--hostname=$hostname" '--unattended=true' '--accept-dns=false'

          if ($LASTEXITCODE -ne 0) {
            & $ts status
            throw 'tailscale up failed.'
          }

          $ip = $null

          for ($i = 1; $i -le 20; $i++) {
            $value = (& $ts ip -4 2>$null | Select-Object -First 1)

            if ($value) {
              $value = $value.ToString().Trim()

              if ($value -match '^\d{1,3}(\.\d{1,3}){3}$') {
                $ip = $value
                break
              }
            }

            Write-Host "Waiting for Tailscale IP: $i/20"
            Start-Sleep -Seconds 3
          }

          if (-not $ip) {
            & $ts status
            throw 'Tailscale IPv4 was not assigned.'
          }

          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Tailscale IP: $ip"

      - name: Configure RDP Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $adapter = Get-NetAdapter | Where-Object {
            $_.Status -eq 'Up' -and (
              $_.Name -like '*Tailscale*' -or
              $_.InterfaceDescription -like '*Tailscale*'
            )
          } | Select-Object -First 1

          if (-not $adapter) {
            Get-NetAdapter | Format-Table -AutoSize
            throw 'Tailscale adapter not found.'
          }

          New-NetFirewallRule -DisplayName 'RDP-Tailscale-TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -InterfaceAlias $adapter.Name -RemoteAddress '100.64.0.0/10' -Profile Any

          New-NetFirewallRule -DisplayName 'RDP-Tailscale-UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 3389 -InterfaceAlias $adapter.Name -RemoteAddress '100.64.0.0/10' -Profile Any

      - name: Verify RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $service = Get-Service -Name 'TermService'

          if ($service.Status -ne 'Running') {
            throw 'TermService is not running.'
          }

          $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw 'TCP 3389 is not listening.'
          }

          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue

          Write-Host "Runner self-test to $env:TAILSCALE_IP:3389 = $($test.TcpTestSucceeded)"

          if (-not $test.TcpTestSucceeded) {
            throw 'Runner self-test to TCP 3389 failed.'
          }

          Write-Host 'RDP listener is ready.'

      - name: Runner Internet Speed Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $zip = Join-Path $env:TEMP 'speedtest.zip'
          $dir = Join-Path $env:TEMP 'speedtest'

          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          $url = 'https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-win64.zip'

          Invoke-WebRequest -Uri $url -OutFile $zip

          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $speedtest = Join-Path $dir 'speedtest.exe'

          if (-not (Test-Path $speedtest)) {
            throw 'speedtest.exe not found.'
          }

          $raw = & $speedtest '--accept-license' '--accept-gdpr' '--progress=no' '--format=json' 2>&1

          if ($LASTEXITCODE -ne 0) {
            $raw | ForEach-Object {
              Write-Host $_
            }

            throw 'Speedtest failed.'
          }

          $result = (($raw | Out-String).Trim()) | ConvertFrom-Json

          $downloadMbps = [math]::Round(([double]$result.download.bandwidth * 8) / 1000000, 2)
          $uploadMbps = [math]::Round(([double]$result.upload.bandwidth * 8) / 1000000, 2)

          $downloadGbps = [math]::Round($downloadMbps / 1000, 3)
          $uploadGbps = [math]::Round($uploadMbps / 1000, 3)

          $ping = [math]::Round([double]$result.ping.latency, 2)

          Write-Host '========================================'
          Write-Host 'ACTUAL RUNNER INTERNET SPEED'
          Write-Host "Ping:       $ping ms"
          Write-Host "Download:   $downloadMbps Mbps"
          Write-Host "Download:   $downloadGbps Gbps"
          Write-Host "Upload:     $uploadMbps Mbps"
          Write-Host "Upload:     $uploadGbps Gbps"
          Write-Host "PacketLoss: $($result.packetLoss)%"
          Write-Host '========================================'

      - name: Show RDP Access
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '=== RDP ACCESS ==='
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host 'Username: RDP'
          Write-Host 'Password: stored in GitHub Secret RDP_PASSWORD'
          Write-Host "Command:  mstsc /v:$env:TAILSCALE_IP"
          Write-Host '=================='

      - name: Maintain Connection
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP active..."
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          Get-NetFirewallRule -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'RDP-Tailscale-*' } |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $ts) {
            & $ts logout
          }
