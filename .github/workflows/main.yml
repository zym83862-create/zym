name: "RDP + Speed Test"

"on":
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "PortNumber" -Value 3389 -Force

          Set-Service -Name "TermService" -StartupType Automatic
          Restart-Service -Name "TermService" -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RDP"
          $passwordText = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($passwordText)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $securePassword = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($null -ne $existing) {
            Set-LocalUser -Name $username -Password $securePassword
          }
          else {
            New-LocalUser -Name $username -Password $securePassword -AccountNeverExpires -PasswordNeverExpires
          }

          Enable-LocalUser -Name $username

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          "RDP_USER=$username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
            throw "RDP user creation failed."
          }

          Write-Host "RDP user is ready."
          Write-Host "Password was not printed."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = Join-Path $env:TEMP "tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $p = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/i", $installer, "/quiet", "/norestart") -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($p.ExitCode -ne 0) {
            throw "Tailscale installation failed with exit code $($p.ExitCode)."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable not found."
          }

          & $ts version

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $svc = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue

          if (-not $svc) {
            throw "Tailscale service not found."
          }

          if ($svc.Status -ne "Running") {
            Start-Service -Name "Tailscale"
            Start-Sleep -Seconds 5
          }

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          & $ts up "--auth-key=$env:TS_AUTH_KEY" "--hostname=$hostname" "--unattended=true" "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
            & $ts status
            throw "tailscale up failed."
          }

          $ip = $null

          for ($i = 1; $i -le 20; $i++) {
            $value = & $ts ip -4 2>$null | Select-Object -First 1

            if ($value) {
              $value = $value.ToString().Trim()

              if ($value -match '^\d{1,3}(\.\d{1,3}){3}$') {
                $ip = $value
                break
              }
            }

            Write-Host "Waiting for Tailscale IP: $i/20"
            Start-Sleep -Seconds 3
          }

          if (-not $ip) {
            & $ts status
            throw "Tailscale IPv4 was not assigned."
          }

          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Tailscale IP: $ip"

      - name: Configure Tailscale RDP Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $adapter = Get-NetAdapter | Where-Object {
            $_.Status -eq "Up" -and (
              $_.Name -like "*Tailscale*" -or
              $_.InterfaceDescription -like "*Tailscale*"
            )
          } | Select-Object -First 1

          if (-not $adapter) {
            Get-NetAdapter | Format-Table -AutoSize
            throw "Tailscale adapter not found."
          }

          Get-NetFirewallRule -DisplayName "RDP-Tailscale-TCP" -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          Get-NetFirewallRule -DisplayName "RDP-Tailscale-UDP" -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue

          New-NetFirewallRule -DisplayName "RDP-Tailscale-TCP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -InterfaceAlias $adapter.Name -RemoteAddress "100.64.0.0/10" -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName "RDP-Tailscale-UDP" -Direction Inbound -Action Allow -Protocol UDP -LocalPort 3389 -InterfaceAlias $adapter.Name -RemoteAddress "100.64.0.0/10" -Profile Any | Out-Null

          Write-Host "Tailscale RDP firewall rules created."

      - name: Verify RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service -Name "TermService"

          if ($service.Status -ne "Running") {
            throw "TermService is not running."
          }

          $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "TCP 3389 is not listening."
          }

          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue

          Write-Host "Runner self-test: $($test.TcpTestSucceeded)"

          if (-not $test.TcpTestSucceeded) {
            throw "Runner self-test to TCP 3389 failed."
          }

          Write-Host "RDP listener is ready."

      - name: Runner Internet Speed Test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $zip = Join-Path $env:TEMP "speedtest.zip"
          $dir = Join-Path $env:TEMP "speedtest"
          $stdout = Join-Path $env:TEMP "speedtest.stdout.txt"
          $stderr = Join-Path $env:TEMP "speedtest.stderr.txt"

          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $stdout -Force -ErrorAction SilentlyContinue
          Remove-Item $stderr -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          Invoke-WebRequest -Uri "https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $exe = Join-Path $dir "speedtest.exe"

          if (-not (Test-Path $exe)) {
            throw "speedtest.exe not found."
          }

          function Get-SpeedTestResult {
            Remove-Item $stdout -Force -ErrorAction SilentlyContinue
            Remove-Item $stderr -Force -ErrorAction SilentlyContinue

            & $exe --accept-license --accept-gdpr --progress=no --format=json > $stdout 2> $stderr
            $exitCode = $LASTEXITCODE

            if ($exitCode -ne 0) {
              Write-Host "Speedtest stderr:"
              if (Test-Path $stderr) {
                Get-Content $stderr | ForEach-Object { Write-Host $_ }
              }
              throw "Speedtest failed with exit code $exitCode."
            }

            $raw = Get-Content $stdout -Raw

            if ([string]::IsNullOrWhiteSpace($raw)) {
              throw "Speedtest returned empty output."
            }

            $start = $raw.IndexOf("{")
            $end = $raw.LastIndexOf("}")

            if ($start -lt 0 -or $end -le $start) {
              Write-Host "Speedtest stdout:"
              Write-Host $raw
              throw "No JSON object found in Speedtest output."
            }

            $json = $raw.Substring($start, $end - $start + 1)

            try {
              return ($json | ConvertFrom-Json)
            }
            catch {
              Write-Host "Extracted Speedtest JSON:"
              Write-Host $json
              throw "Speedtest JSON parsing failed."
            }
          }

          Write-Host "========================================"
          Write-Host "ACTUAL RUNNER INTERNET SPEED"
          Write-Host "Running 3 real measurements..."
          Write-Host "========================================"

          $results = @()

          for ($i = 1; $i -le 3; $i++) {
            Write-Host ""
            Write-Host "Measurement $i of 3..."

            $r = Get-SpeedTestResult

            $downloadMbps = [math]::Round(([double]$r.download.bandwidth * 8) / 1000000, 2)
            $uploadMbps = [math]::Round(([double]$r.upload.bandwidth * 8) / 1000000, 2)
            $pingMs = [math]::Round([double]$r.ping.latency, 2)

            $results += [pscustomobject]@{
              DownloadMbps = $downloadMbps
              UploadMbps = $uploadMbps
              PingMs = $pingMs
              Server = $r.server.name
              Location = $r.server.location
              ISP = $r.isp
            }

            Write-Host "Server:   $($r.server.name)"
            Write-Host "Location: $($r.server.location)"
            Write-Host "Ping:     $pingMs ms"
            Write-Host "Download: $downloadMbps Mbps"
            Write-Host "Upload:   $uploadMbps Mbps"

            if ($i -lt 3) {
              Start-Sleep -Seconds 3
            }
          }

          $bestDownload = $results | Sort-Object DownloadMbps -Descending | Select-Object -First 1
          $bestUpload = $results | Sort-Object UploadMbps -Descending | Select-Object -First 1
          $avgDownload = [math]::Round((($results | Measure-Object -Property DownloadMbps -Average).Average), 2)
          $avgUpload = [math]::Round((($results | Measure-Object -Property UploadMbps -Average).Average), 2)

          Write-Host ""
          Write-Host "========================================"
          Write-Host "FINAL MEASURED RUNNER SPEED"
          Write-Host "========================================"
          Write-Host "Best Download:    $($bestDownload.DownloadMbps) Mbps"
          Write-Host "Best Download:    $([math]::Round($bestDownload.DownloadMbps / 1000, 3)) Gbps"
          Write-Host "Best Upload:      $($bestUpload.UploadMbps) Mbps"
          Write-Host "Best Upload:      $([math]::Round($bestUpload.UploadMbps / 1000, 3)) Gbps"
          Write-Host "Average Download: $avgDownload Mbps"
          Write-Host "Average Upload:   $avgUpload Mbps"
          Write-Host "========================================"

      - name: Show RDP Access
        shell: pwsh
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: GitHub Secret RDP_PASSWORD"
          Write-Host "Command:  mstsc /v:$env:TAILSCALE_IP"

      - name: Maintain Connection
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP active..."
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          Get-NetFirewallRule -DisplayName "RDP-Tailscale-TCP" -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          Get-NetFirewallRule -DisplayName "RDP-Tailscale-UDP" -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $ts) {
            & $ts logout
          }
